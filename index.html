<!DOCTYPE html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nova+Round&display=swap" rel="stylesheet">
    </head>
    <body>
        <button id="dark-mode-toggle">Light / Dark Mode</button>
        <div class="card">
            <div id="header">
                <h1><span style="color:#FDF0D5; text-shadow: 3px 2px 1px #C1121F;">Generate a </span><br/> <span style="color:#c1121f; text-shadow: -1px -1px 1px #FDF0D5;">random password!</span></h1>
            </div>
            <div id="paragraph-text">
                <p>Never use an insecure password again.</p>
            </div>
            <button id="generating-btn" onclick="pressedButton()" >Generate Password</button>
        </div>
            <br></br>
                <hr class="solid">
            <br></br>
            <div class="password-section">
                <div id="textBoxOne"> 
                    <p id="pass-one"></p>
                </div>
                <div id="textBoxTwo"> 
                    <p id="pass-two"></p>
                </div>
            </div>
            <p id="signature"> Made By: Mazen Elsayed </p>
        <script src="index.js"></script>
    </body>
</html>
